name: Import fixed T01 history
on:
  push:
    paths:
      - .github/workflows/import-t01.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed public T01 commit
        run: |
          git fetch https://github.com/yxh750501-sys/SKT_ALEPH.git 8eb40817b042dbe87efc44468d6ddf667fd061c8
          test "$(git rev-parse FETCH_HEAD)" = 8eb40817b042dbe87efc44468d6ddf667fd061c8
          git push origin FETCH_HEAD:refs/heads/t01-base
